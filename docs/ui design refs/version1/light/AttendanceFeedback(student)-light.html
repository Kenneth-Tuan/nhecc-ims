<!DOCTYPE html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Attendance Feedback</title>
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Configuration -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#e57f4f",
              "background-light": "#f8f6f6",
              "background-dark": "#211611",
              success: "#22c55e",
              "surface-light": "#ffffff",
              "surface-dark": "#331818",
            },
            fontFamily: { display: "Inter" },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            boxShadow: {
              soft: "0 10px 40px -10px rgba(0,0,0,0.08)",
              "inner-glow": "inset 0 0 0 1px rgba(255,255,255,0.1)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", "Noto Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark transition-colors duration-200"
  >
    <div
      class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden font-display"
    >
      <!-- Top App Bar -->
      <header
        class="flex items-center px-6 py-4 justify-between sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm"
      >
        <button
          aria-label="Go back"
          class="text-[#1b0d0d] dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full active:bg-black/5 dark:active:bg-white/10 transition-colors"
        >
          <span class="material-symbols-outlined text-[28px]">arrow_back</span>
        </button>
        <h2
          class="text-[#1b0d0d] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12"
        >
          簽到結果
        </h2>
      </header>
      <!-- Main Content -->
      <main
        class="flex-1 flex flex-col items-center px-6 pt-4 pb-8 w-full max-w-md mx-auto"
      >
        <!-- Success Illustration Area -->
        <div
          class="relative flex flex-col items-center justify-center mt-4 mb-8"
        >
          <!-- Background Decoration -->
          <div
            class="absolute inset-0 bg-success/10 rounded-full blur-3xl transform scale-150 opacity-50"
          ></div>
          <!-- Main Illustration Container -->
          <div
            class="relative z-10 w-48 h-48 bg-surface-light dark:bg-surface-dark rounded-full flex items-center justify-center shadow-soft border-4 border-white dark:border-white/5"
          >
            <!-- Placeholder for friendly illustration -->
            <div
              class="w-full h-full rounded-full overflow-hidden absolute opacity-20"
            >
              <div
                class="w-full h-full bg-center bg-cover"
                data-alt="Abstract happy confetti pattern in soft green tones"
                style="
                  background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBJBKS7ZnFJ_G25i91lc6iYpaKpjec0F3A1Y1fNIaZRP3qH-uRpRm-H0Sh1E6PHJGrA7QOlAghBxzp1cQMP4qVVWQSKtAmNk-ACC1A3FtKd9UOWqse2S3MVKeVbp-xUTKS0gofWbkFPYyiA6wrZkbnDF3gyqaMo2o9TRcyDPg7owqByaTc78jkXffCfyIBe1r_yXpGRDJdcanb_LATdj0rr7-yULw66Hn8gGjqC2Z9gPOncM8GdkRWmg56EXe7I6S-lwdETuL-T0OQ');
                "
              ></div>
            </div>
            <!-- Success Checkmark Icon -->
            <div
              class="relative z-20 bg-success rounded-full p-4 shadow-lg animate-bounce-slight"
            >
              <span
                class="material-symbols-outlined text-white text-[64px] font-bold"
                >check</span
              >
            </div>
          </div>
        </div>
        <!-- Feedback Text -->
        <div class="text-center mb-10 z-10">
          <h1
            class="text-[#1b0d0d] dark:text-white tracking-tight text-[32px] font-bold leading-tight pb-3"
          >
            簽到成功 !
          </h1>
          <p
            class="text-gray-600 dark:text-gray-300 text-lg font-normal leading-normal px-4"
          >
            您已成功完成主日學課程簽到
          </p>
        </div>
        <!-- Course Detail Soft Card -->
        <div
          class="w-full bg-surface-light dark:bg-surface-dark rounded-xl shadow-soft p-6 mb-6 border border-gray-100 dark:border-white/5 relative overflow-hidden group"
        >
          <!-- Card decorative accent -->
          <div class="absolute top-0 left-0 w-2 h-full bg-success"></div>
          <h3
            class="text-gray-400 dark:text-gray-500 text-sm font-semibold uppercase tracking-wider mb-4 pl-2"
          >
            課程資訊
          </h3>
          <div class="flex flex-col gap-5 pl-2">
            <!-- Course Name -->
            <div class="flex items-start gap-4">
              <div class="bg-gray-100 dark:bg-white/10 p-2 rounded-lg shrink-0">
                <span
                  class="material-symbols-outlined text-gray-700 dark:text-gray-200 text-[24px]"
                  >menu_book</span
                >
              </div>
              <div class="flex flex-col">
                <span class="text-gray-500 dark:text-gray-400 text-sm"
                  >課程名稱</span
                >
                <span
                  class="text-[#1b0d0d] dark:text-white text-lg font-bold leading-tight"
                  >主日學課程 (中級)</span
                >
              </div>
            </div>
            <!-- Time -->
            <div class="flex items-start gap-4">
              <div class="bg-gray-100 dark:bg-white/10 p-2 rounded-lg shrink-0">
                <span
                  class="material-symbols-outlined text-gray-700 dark:text-gray-200 text-[24px]"
                  >schedule</span
                >
              </div>
              <div class="flex flex-col">
                <span class="text-gray-500 dark:text-gray-400 text-sm"
                  >時間</span
                >
                <span
                  class="text-[#1b0d0d] dark:text-white text-lg font-bold leading-tight"
                  >09:30 AM - 11:00 AM</span
                >
              </div>
            </div>
            <!-- Location -->
            <div class="flex items-start gap-4">
              <div class="bg-gray-100 dark:bg-white/10 p-2 rounded-lg shrink-0">
                <span
                  class="material-symbols-outlined text-gray-700 dark:text-gray-200 text-[24px]"
                  >location_on</span
                >
              </div>
              <div class="flex flex-col">
                <span class="text-gray-500 dark:text-gray-400 text-sm"
                  >地點</span
                >
                <span
                  class="text-[#1b0d0d] dark:text-white text-lg font-bold leading-tight"
                  >302 教室</span
                >
              </div>
            </div>
          </div>
        </div>
        <!-- Spacer to push button to bottom if needed on tall screens -->
        <div class="flex-1"></div>
        <!-- Action Button -->
        <div class="w-full mt-4">
          <button
            class="w-full bg-primary hover:bg-red-700 active:bg-red-800 text-white text-xl font-bold py-4 px-6 rounded-full shadow-lg shadow-red-500/30 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2"
          >
            <span class="material-symbols-outlined">check_circle</span>
            完成
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
