services:
  nhecc-ims:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhecc-ims-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      # Add other environment variables here or use env_file
      # - NUXT_LIFF_ID=${NUXT_LIFF_ID}
      # - NUXT_LINE_CHANNEL_ID=${NUXT_LINE_CHANNEL_ID}
    env_file:
      - .env
    restart: unless-stopped
    # Healthcheck to ensure service is up
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge
